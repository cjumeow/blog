# Site Settings
locale                   : "en"
title                    : "I'm Guanjun"
title_separator          : "-"
subtitle                 : "Personal Site"
name                     : "Andrew"
description              : "Personal website and blog"
url                      : "" # Fill in with your production URL after deploying to Vercel, e.g. https://blog.vercel.app
baseurl                  : ""
repository               : "cjumeow/blog"
teaser                   :
logo                     :
masthead_title           : "我是冠均"

# Build settings
markdown                 : kramdown
remote_theme             :
theme                    : minimal-mistakes-jekyll
minimal_mistakes_skin    : "default"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

# Site Author
author:
  name             : "Andrew"
  avatar           :
  bio              : "A personal space for wrestling with AI anxiety"
  location         :
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/cjumeow"

# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/cjumeow"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

paginate: 5
paginate_path: /page:num/

include: ["_pages"]
